<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Agent groups and consolidation</title><desc id="desc">Illustrative agent groups explore variants and feed a consolidation layer before a candidate proof.</desc><rect width="1600" height="900" fill="#071827"/><text x="90" y="105" fill="#f8fafc" font-family="Arial" font-size="52" font-weight="700">Parallel search needs an information topology</text><text x="90" y="158" fill="#94a3b8" font-family="Arial" font-size="24">Illustrative topology based on disclosed process elements</text>
<g font-family="Arial" text-anchor="middle"><g fill="#12355b" stroke="#38bdf8" stroke-width="3"><rect x="90" y="260" width="260" height="150" rx="24"/><rect x="90" y="475" width="260" height="150" rx="24"/><rect x="450" y="260" width="260" height="150" rx="24"/><rect x="450" y="475" width="260" height="150" rx="24"/></g><g fill="#e0f2fe" font-size="27" font-weight="700"><text x="220" y="325">GROUP A</text><text x="220" y="370">Problem variant</text><text x="220" y="540">GROUP B</text><text x="220" y="585">Alternative route</text><text x="580" y="325">GROUP C</text><text x="580" y="370">Code experiments</text><text x="580" y="540">GROUP D</text><text x="580" y="585">Critique + repair</text></g>
<rect x="850" y="325" width="300" height="240" rx="30" fill="#3b1d5c" stroke="#c084fc" stroke-width="4"/><text x="1000" y="410" fill="#fff" font-size="31" font-weight="700">CONSOLIDATION</text><text x="1000" y="463" fill="#f3e8ff" font-size="24">select • compress</text><text x="1000" y="505" fill="#f3e8ff" font-size="24">cross-pollinate</text><rect x="1290" y="350" width="240" height="190" rx="28" fill="#3f2b0b" stroke="#fbbf24" stroke-width="4"/><text x="1410" y="430" fill="#fff" font-size="30" font-weight="700">CANDIDATE</text><text x="1410" y="480" fill="#fef3c7" font-size="24">proof artifact</text></g>
<g stroke="#64748b" stroke-width="7" fill="none"><path d="M350 335C650 335 680 390 850 420"/><path d="M350 550C650 550 680 500 850 475"/><path d="M710 335L850 420"/><path d="M710 550L850 475"/><path d="M1150 445H1290"/></g><g fill="#94a3b8" font-family="Arial" font-size="22"><text x="160" y="720">Risk: correlated exploration</text><text x="650" y="720">Risk: lossy summaries</text><text x="1120" y="720">Risk: persuasive but wrong synthesis</text></g><text x="800" y="820" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="22">Diversity without provenance creates more output, not more confidence.</text></svg>
