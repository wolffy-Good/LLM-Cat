<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From question to checkable artifact</title><desc id="desc">A four stage pipeline from diverse agent search through consolidation and proof writing to formal and independent verification.</desc>
  <rect width="1600" height="900" fill="#08111f"/><text x="100" y="120" fill="#f8fafc" font-family="Arial" font-size="54" font-weight="700">Discovery scales. Trust must be engineered.</text>
  <text x="100" y="175" fill="#94a3b8" font-family="Arial" font-size="26">Published process, simplified • not an independent proof audit</text>
  <g font-family="Arial"><rect x="90" y="300" width="310" height="300" rx="28" fill="#172554" stroke="#60a5fa" stroke-width="4"/><text x="245" y="385" fill="#fff" font-size="34" text-anchor="middle" font-weight="700">SEARCH</text><text x="245" y="450" fill="#bfdbfe" font-size="25" text-anchor="middle">~10,000 concurrent</text><text x="245" y="490" fill="#bfdbfe" font-size="25" text-anchor="middle">agents</text><text x="245" y="555" fill="#93c5fd" font-size="22" text-anchor="middle">diverse prompts + tools</text>
  <rect x="470" y="300" width="310" height="300" rx="28" fill="#164e63" stroke="#22d3ee" stroke-width="4"/><text x="625" y="385" fill="#fff" font-size="34" text-anchor="middle" font-weight="700">CONSOLIDATE</text><text x="625" y="450" fill="#cffafe" font-size="25" text-anchor="middle">cross-pollinate</text><text x="625" y="490" fill="#cffafe" font-size="25" text-anchor="middle">promising paths</text><text x="625" y="555" fill="#67e8f9" font-size="22" text-anchor="middle">compression is a risk</text>
  <rect x="850" y="300" width="310" height="300" rx="28" fill="#3b1d5c" stroke="#c084fc" stroke-width="4"/><text x="1005" y="385" fill="#fff" font-size="34" text-anchor="middle" font-weight="700">ARTIFACT</text><text x="1005" y="450" fill="#f3e8ff" font-size="25" text-anchor="middle">analytical proof</text><text x="1005" y="490" fill="#f3e8ff" font-size="25" text-anchor="middle">+ Lean code</text><text x="1005" y="555" fill="#d8b4fe" font-size="22" text-anchor="middle">small enough to inspect</text>
  <rect x="1230" y="300" width="280" height="300" rx="28" fill="#3f2b0b" stroke="#fbbf24" stroke-width="4"/><text x="1370" y="385" fill="#fff" font-size="34" text-anchor="middle" font-weight="700">VERIFY</text><text x="1370" y="450" fill="#fef3c7" font-size="25" text-anchor="middle">formal checks</text><text x="1370" y="490" fill="#fef3c7" font-size="25" text-anchor="middle">+ expert review</text><text x="1370" y="555" fill="#fde68a" font-size="22" text-anchor="middle">acceptance is separate</text></g>
  <g fill="#64748b"><path d="M410 450h45l-18-18 16-16 45 34-45 34-16-16 18-18h-45z"/><path d="M790 450h45l-18-18 16-16 45 34-45 34-16-16 18-18h-45z"/><path d="M1170 450h45l-18-18 16-16 45 34-45 34-16-16 18-18h-45z"/></g>
  <text x="800" y="750" text-anchor="middle" fill="#e2e8f0" font-family="Arial" font-size="32">130B output tokens → one reviewable claim boundary</text><text x="800" y="805" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="22">Source: OpenAI announcement, checked 2026-09-09</text>
</svg>
