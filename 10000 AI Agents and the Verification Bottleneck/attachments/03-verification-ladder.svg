<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Verification ladder</title><desc id="desc">Four levels distinguish claim, inspectable artifacts, machine checks, and community acceptance.</desc><rect width="1600" height="900" fill="#0b1020"/><text x="100" y="105" fill="#f8fafc" font-family="Arial" font-size="54" font-weight="700">Verification is a ladder, not a badge</text><text x="100" y="160" fill="#94a3b8" font-family="Arial" font-size="24">Each level adds evidence; no level silently substitutes for the next.</text><g font-family="Arial"><rect x="120" y="600" width="330" height="130" rx="20" fill="#3f1d2e" stroke="#fb7185" stroke-width="4"/><text x="285" y="655" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">1 • CLAIMED</text><text x="285" y="700" text-anchor="middle" fill="#fecdd3" font-size="22">announcement</text><rect x="450" y="470" width="330" height="260" rx="20" fill="#3b2b12" stroke="#fbbf24" stroke-width="4"/><text x="615" y="535" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">2 • INSPECTABLE</text><text x="615" y="580" text-anchor="middle" fill="#fef3c7" font-size="22">paper + repository</text><rect x="780" y="340" width="330" height="390" rx="20" fill="#16324a" stroke="#38bdf8" stroke-width="4"/><text x="945" y="410" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">3 • CHECKED</text><text x="945" y="455" text-anchor="middle" fill="#e0f2fe" font-size="22">formal build + scope audit</text><rect x="1110" y="210" width="370" height="520" rx="20" fill="#183b2c" stroke="#4ade80" stroke-width="4"/><text x="1295" y="285" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">4 • ACCEPTED</text><text x="1295" y="330" text-anchor="middle" fill="#dcfce7" font-size="22">independent expert scrutiny</text><text x="1295" y="620" text-anchor="middle" fill="#86efac" font-size="22">institutional decisions</text></g><text x="800" y="820" text-anchor="middle" fill="#cbd5e1" font-family="Arial" font-size="25">At check time, Clay still listed Navier–Stokes as unsolved.</text></svg>
