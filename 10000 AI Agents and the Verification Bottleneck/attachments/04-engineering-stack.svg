<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Practical agent verification stack</title><desc id="desc">A layered engineering stack separates model access, orchestration, provenance, deterministic checks, and independent review.</desc><rect width="1600" height="900" fill="#08121c"/><text x="100" y="100" fill="#f8fafc" font-family="Arial" font-size="52" font-weight="700">A practical verification stack for agent swarms</text><text x="100" y="153" fill="#94a3b8" font-family="Arial" font-size="24">Recommended controls inferred from the research pattern</text><g font-family="Arial"><rect x="180" y="650" width="1240" height="100" rx="20" fill="#172554" stroke="#60a5fa" stroke-width="3"/><text x="800" y="712" text-anchor="middle" fill="#dbeafe" font-size="29" font-weight="700">MODEL ACCESS • ROUTING • QUOTAS • COST ACCOUNTING</text><rect x="250" y="520" width="1100" height="100" rx="20" fill="#164e63" stroke="#22d3ee" stroke-width="3"/><text x="800" y="582" text-anchor="middle" fill="#cffafe" font-size="29" font-weight="700">ORCHESTRATION • ROLE SEPARATION • STOPPING RULES</text><rect x="320" y="390" width="960" height="100" rx="20" fill="#3b1d5c" stroke="#c084fc" stroke-width="3"/><text x="800" y="452" text-anchor="middle" fill="#f3e8ff" font-size="29" font-weight="700">PROVENANCE • REPLAY • ARTIFACT HASHES</text><rect x="390" y="260" width="820" height="100" rx="20" fill="#3f2b0b" stroke="#fbbf24" stroke-width="3"/><text x="800" y="322" text-anchor="middle" fill="#fef3c7" font-size="29" font-weight="700">DETERMINISTIC TESTS • FORMAL CHECKS</text><rect x="460" y="130" width="680" height="100" rx="20" fill="#183b2c" stroke="#4ade80" stroke-width="3"/><text x="800" y="192" text-anchor="middle" fill="#dcfce7" font-size="29" font-weight="700">INDEPENDENT REPRODUCTION + EXPERT REVIEW</text></g><text x="800" y="825" text-anchor="middle" fill="#94a3b8" font-family="Arial" font-size="23">More agents increase the load on every layer above them.</text></svg>
