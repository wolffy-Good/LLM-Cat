<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f7f5ef"/>
  <text x="92" y="112" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700">Three artifacts teams should keep separate</text>
  <text x="92" y="156" fill="#5b5f58" font-family="Helvetica, Arial, sans-serif" font-size="23">The article's evidence-first argument depends on not collapsing these layers into one verdict.</text>

  <rect x="110" y="250" width="390" height="360" rx="22" fill="#d9ead3" stroke="#1f2a30" stroke-width="3"/>
  <text x="146" y="318" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="33" font-weight="700">1. Tool declaration</text>
  <text x="146" y="368" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="24">What the tool says about itself:</text>
  <text x="146" y="414" fill="#1f2a30" font-family="Courier New, monospace" font-size="24">readOnlyHint: true</text>
  <text x="146" y="466" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="24">Useful for metadata, UX, defaults.</text>
  <text x="146" y="514" fill="#a61c00" font-family="Helvetica, Arial, sans-serif" font-size="24">Not proof of runtime safety.</text>

  <rect x="605" y="250" width="390" height="360" rx="22" fill="#fce5cd" stroke="#1f2a30" stroke-width="3"/>
  <text x="641" y="318" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="33" font-weight="700">2. Execution record</text>
  <text x="641" y="368" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="24">What actually happened:</text>
  <text x="641" y="414" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="24">writes, egress, side effects, scope</text>
  <text x="641" y="466" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="24">Observed under bounded tests or logs.</text>
  <text x="641" y="514" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="24">This is where evidence starts.</text>

  <rect x="1100" y="250" width="390" height="360" rx="22" fill="#d0e0f6" stroke="#1f2a30" stroke-width="3"/>
  <text x="1136" y="318" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="33" font-weight="700">3. Policy decision</text>
  <text x="1136" y="368" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="24">What the system allows next:</text>
  <text x="1136" y="414" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="24">block, require approval, or continue</text>
  <text x="1136" y="466" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="24">Should depend on the first two,</text>
  <text x="1136" y="500" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="24">not replace them.</text>

  <path d="M500 430h70" stroke="#1f2a30" stroke-width="6" fill="none"/>
  <polygon points="570,430 544,415 544,445" fill="#1f2a30"/>
  <path d="M995 430h70" stroke="#1f2a30" stroke-width="6" fill="none"/>
  <polygon points="1065,430 1039,415 1039,445" fill="#1f2a30"/>

  <text x="110" y="710" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">Operational rule</text>
  <text x="110" y="754" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="29">Metadata can guide review, but only observed behavior and preserved evidence can justify a strong safety claim.</text>
</svg>
