<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#eef3ea"/>
  <text x="90" y="110" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700">One action, many paths: approval must protect each reachable route</text>
  <text x="90" y="154" fill="#556067" font-family="Helvetica, Arial, sans-serif" font-size="23">Source-grounded summary of the article's rollback and bypass argument.</text>

  <rect x="90" y="220" width="320" height="110" rx="20" fill="#fffaf2" stroke="#1f2a30" stroke-width="3"/>
  <text x="130" y="285" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700">Sensitive action</text>

  <rect x="540" y="150" width="380" height="130" rx="20" fill="#d9ead3" stroke="#1f2a30" stroke-width="3"/>
  <text x="576" y="214" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">Path A: harness with approval</text>
  <text x="576" y="252" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="23">Human review, identity checks, policy logs</text>

  <rect x="540" y="365" width="380" height="130" rx="20" fill="#fce5cd" stroke="#1f2a30" stroke-width="3"/>
  <text x="576" y="429" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">Path B: direct MCP endpoint</text>
  <text x="576" y="467" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="23">May bypass the expected approval layer</text>

  <rect x="540" y="580" width="380" height="130" rx="20" fill="#f4cccc" stroke="#1f2a30" stroke-width="3"/>
  <text x="576" y="644" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">Path C: proxy or retry job</text>
  <text x="576" y="682" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="23">Operational shortcut can re-open the risk</text>

  <rect x="1080" y="220" width="410" height="110" rx="20" fill="#d0e0f6" stroke="#1f2a30" stroke-width="3"/>
  <text x="1120" y="285" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="33" font-weight="700">Real safety property</text>

  <path d="M410 275h92" stroke="#1f2a30" stroke-width="6" fill="none"/>
  <polygon points="502,275 476,260 476,290" fill="#1f2a30"/>
  <path d="M920 215h120" stroke="#1f2a30" stroke-width="6" fill="none"/>
  <polygon points="1040,215 1014,200 1014,230" fill="#1f2a30"/>
  <path d="M920 430h120" stroke="#b45f06" stroke-width="6" fill="none" stroke-dasharray="14 12"/>
  <polygon points="1040,430 1014,415 1014,445" fill="#b45f06"/>
  <path d="M920 645h120" stroke="#a61c00" stroke-width="6" fill="none" stroke-dasharray="14 12"/>
  <polygon points="1040,645 1014,630 1014,660" fill="#a61c00"/>

  <text x="1118" y="396" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="26">Approval is only real when every path</text>
  <text x="1118" y="432" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="26">to the action is mediated before execution.</text>
  <text x="1118" y="492" fill="#b45f06" font-family="Helvetica, Arial, sans-serif" font-size="24">Dashed arrows = bypass risk if only one path is protected.</text>
</svg>
