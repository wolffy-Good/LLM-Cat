<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Four gates before an agent action</title><desc id="desc">A pipeline requiring reachability, identity, authorization, and consequence checks before an external action can execute.</desc>
  <rect width="1600" height="900" fill="#071421"/><text x="100" y="110" fill="#f7fbff" font-family="Arial,sans-serif" font-size="54" font-weight="700">Reachable does not mean authorized</text><text x="100" y="165" fill="#96b3cb" font-family="Arial,sans-serif" font-size="25">A machine-checkable contract should decide—not the task narrative alone.</text>
  <g font-family="Arial,sans-serif">
    <rect x="80" y="300" width="250" height="260" rx="30" fill="#12304a" stroke="#4aa8e8" stroke-width="4"/><circle cx="205" cy="350" r="34" fill="#4aa8e8"/><text x="194" y="362" fill="#071421" font-size="32" font-weight="700">1</text><text x="120" y="430" fill="white" font-size="31" font-weight="700">Reachability</text><text x="120" y="480" fill="#c5deee" font-size="22">Can it connect?</text>
    <rect x="390" y="300" width="250" height="260" rx="30" fill="#153a3a" stroke="#54d6b0" stroke-width="4"/><circle cx="515" cy="350" r="34" fill="#54d6b0"/><text x="504" y="362" fill="#071421" font-size="32" font-weight="700">2</text><text x="430" y="430" fill="white" font-size="31" font-weight="700">Identity</text><text x="430" y="480" fill="#c7eee4" font-size="22">Who is the target?</text>
    <rect x="700" y="300" width="250" height="260" rx="30" fill="#3b3018" stroke="#ffc857" stroke-width="4"/><circle cx="825" cy="350" r="34" fill="#ffc857"/><text x="814" y="362" fill="#071421" font-size="32" font-weight="700">3</text><text x="740" y="430" fill="white" font-size="31" font-weight="700">Authorization</text><text x="740" y="480" fill="#f1e2bd" font-size="22">Is it in scope?</text>
    <rect x="1010" y="300" width="250" height="260" rx="30" fill="#40232c" stroke="#ff7b9c" stroke-width="4"/><circle cx="1135" cy="350" r="34" fill="#ff7b9c"/><text x="1124" y="362" fill="#071421" font-size="32" font-weight="700">4</text><text x="1050" y="430" fill="white" font-size="31" font-weight="700">Consequence</text><text x="1050" y="480" fill="#f2cad4" font-size="22">What will change?</text>
    <rect x="1320" y="300" width="200" height="260" rx="30" fill="#173d29" stroke="#6ee7a5" stroke-width="4"/><path d="m1375 418 38 38 66-82" fill="none" stroke="#6ee7a5" stroke-width="12"/><text x="1362" y="510" fill="white" font-size="27" font-weight="700">EXECUTE</text>
    <path d="M330 430h60M640 430h60M950 430h60M1260 430h60" stroke="#a9bfd0" stroke-width="7"/>
  </g>
  <rect x="210" y="665" width="1180" height="110" rx="24" fill="#101f2d" stroke="#29445b" stroke-width="2"/><text x="800" y="735" text-anchor="middle" fill="#d9e7f1" font-family="Arial,sans-serif" font-size="28">Any ambiguity → stop, record evidence, require review</text>
</svg>
