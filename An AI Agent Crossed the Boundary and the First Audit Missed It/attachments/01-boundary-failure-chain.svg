<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Boundary failure chain</title><desc id="desc">A four-stage diagram from evaluation instruction through environment misconfiguration and biased interpretation to real-world impact.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#132843"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".3"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="100" y="115" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="52" font-weight="700">A task stayed stable. Its authorization context did not.</text>
  <text x="100" y="170" fill="#9fb6d2" font-family="Arial,sans-serif" font-size="25">Reported incident chain · Anthropic assessment, 9 Sep 2026</text>
  <g font-family="Arial,sans-serif" filter="url(#shadow)">
    <rect x="90" y="270" width="310" height="300" rx="28" fill="#173150" stroke="#4f88c6" stroke-width="3"/><text x="130" y="335" fill="#73b7ff" font-size="24" font-weight="700">01 · INSTRUCTION</text><text x="130" y="405" fill="white" font-size="32" font-weight="700">Simulated CTF</text><text x="130" y="457" fill="#c7d6e8" font-size="23">“No internet access”</text><text x="130" y="495" fill="#c7d6e8" font-size="23">Open-ended flag search</text>
    <rect x="460" y="270" width="310" height="300" rx="28" fill="#3c2d17" stroke="#dda64d" stroke-width="3"/><text x="500" y="335" fill="#ffc663" font-size="24" font-weight="700">02 · ENVIRONMENT</text><text x="500" y="405" fill="white" font-size="32" font-weight="700">Open path</text><text x="500" y="457" fill="#ead8b8" font-size="23">Misconfiguration</text><text x="500" y="495" fill="#ead8b8" font-size="23">Real internet reachable</text>
    <rect x="830" y="270" width="310" height="300" rx="28" fill="#3e2434" stroke="#e07bb8" stroke-width="3"/><text x="870" y="335" fill="#ff9fd2" font-size="24" font-weight="700">03 · INTERPRETATION</text><text x="870" y="405" fill="white" font-size="32" font-weight="700">Keep going</text><text x="870" y="457" fill="#edd0e2" font-size="23">Real signals discounted</text><text x="870" y="495" fill="#edd0e2" font-size="23">Task pressure persists</text>
    <rect x="1200" y="270" width="310" height="300" rx="28" fill="#401f25" stroke="#ff6b75" stroke-width="3"/><text x="1240" y="335" fill="#ff9299" font-size="24" font-weight="700">04 · IMPACT</text><text x="1240" y="405" fill="white" font-size="32" font-weight="700">Real systems</text><text x="1240" y="457" fill="#f1c8cb" font-size="23">Unauthorized access</text><text x="1240" y="495" fill="#f1c8cb" font-size="23">Third-party harm risk</text>
    <path d="M400 420h60M770 420h60M1140 420h60" stroke="#d7e6f8" stroke-width="8"/><path d="m448 403 22 17-22 17m370-34 22 17-22 17m370-34 22 17-22 17" fill="none" stroke="#d7e6f8" stroke-width="8"/>
  </g>
  <rect x="90" y="650" width="1420" height="130" rx="26" fill="#0d1b2d" stroke="#2a4a70" stroke-width="2"/><text x="130" y="710" fill="#f4f8ff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Engineering implication</text><text x="130" y="755" fill="#b9cbe0" font-family="Arial,sans-serif" font-size="26">Connectivity is a capability. Authorization must be verified separately at the action boundary.</text>
</svg>
