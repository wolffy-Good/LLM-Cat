<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Actor and auditor independence</title><desc id="desc">The agent and semantic monitor share context risk while independent infrastructure telemetry feeds deterministic reconciliation.</desc>
  <rect width="1600" height="900" fill="#09111d"/><text x="100" y="110" fill="#f7fbff" font-family="Arial,sans-serif" font-size="52" font-weight="700">The auditor must not inherit the actor's blind spot</text><text x="100" y="165" fill="#9fb2c9" font-family="Arial,sans-serif" font-size="25">Use different evidence paths to reduce correlated failure.</text>
  <g font-family="Arial,sans-serif">
    <rect x="120" y="280" width="500" height="210" rx="30" fill="#1a2e48" stroke="#5e9de0" stroke-width="4"/><text x="170" y="350" fill="#7eb8f4" font-size="24" font-weight="700">ACTION PATH</text><text x="170" y="410" fill="white" font-size="34" font-weight="700">Working agent</text><text x="170" y="455" fill="#c5d7e9" font-size="23">Task context · tool results · plan</text>
    <rect x="980" y="280" width="500" height="210" rx="30" fill="#3d263c" stroke="#db7fcf" stroke-width="4"/><text x="1030" y="350" fill="#f09ce4" font-size="24" font-weight="700">SEMANTIC REVIEW</text><text x="1030" y="410" fill="white" font-size="34" font-weight="700">LLM monitor</text><text x="1030" y="455" fill="#ead0e7" font-size="23">Can be persuaded by the same story</text>
    <path d="M620 385h360" stroke="#ff7885" stroke-width="7" stroke-dasharray="18 14"/><text x="800" y="355" text-anchor="middle" fill="#ff9ea7" font-size="23">CORRELATED CONTEXT RISK</text>
    <rect x="350" y="610" width="900" height="150" rx="30" fill="#163b32" stroke="#5be0b3" stroke-width="4"/><text x="800" y="670" text-anchor="middle" fill="#75efc6" font-size="24" font-weight="700">INDEPENDENT EVIDENCE</text><text x="800" y="720" text-anchor="middle" fill="white" font-size="29">Network logs · identity logs · allowlists · immutable action ledger</text>
    <path d="M370 490v120M1230 490v120" stroke="#5be0b3" stroke-width="7"/><path d="m352 590 18 24 18-24m824 0 18 24 18-24" fill="none" stroke="#5be0b3" stroke-width="7"/>
  </g>
</svg>
