<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Oversight requires more than coverage</title><desc id="d">Action coverage, detection testing, timely escalation, and effective intervention form an oversight chain.</desc>
<rect width="1200" height="675" fill="#0c1425"/><g font-family="Arial,sans-serif"><text x="70" y="88" fill="white" font-size="40" font-weight="700">From coverage to intervention</text>
<rect x="75" y="150" width="260" height="190" rx="18" fill="#254366"/><rect x="338" y="150" width="260" height="190" rx="18" fill="#206574"/><rect x="601" y="150" width="260" height="190" rx="18" fill="#695a41"/><rect x="864" y="150" width="260" height="190" rx="18" fill="#4e487b"/>
<text x="100" y="210" fill="white" font-size="27" font-weight="700">Coverage</text><text x="100" y="260" fill="white" font-size="18">Did an action pass</text><text x="100" y="290" fill="white" font-size="18">through a monitor?</text>
<text x="363" y="210" fill="white" font-size="27" font-weight="700">Detection</text><text x="363" y="260" fill="white" font-size="18">Did it recognize a</text><text x="363" y="290" fill="white" font-size="18">known bad case?</text>
<text x="626" y="210" fill="white" font-size="27" font-weight="700">Escalation</text><text x="626" y="260" fill="white" font-size="18">Did the right person</text><text x="626" y="290" fill="white" font-size="18">see it in time?</text>
<text x="889" y="210" fill="white" font-size="27" font-weight="700">Intervention</text><text x="889" y="260" fill="white" font-size="18">Was a harmful action</text><text x="889" y="290" fill="white" font-size="18">actually prevented?</text>
<path d="M96 419 H1100" stroke="#74d3c6" stroke-width="5"/><circle cx="204" cy="419" r="13" fill="#74d3c6"/><circle cx="467" cy="419" r="13" fill="#74d3c6"/><circle cx="730" cy="419" r="13" fill="#74d3c6"/><circle cx="993" cy="419" r="13" fill="#74d3c6"/>
<text x="75" y="510" fill="#dce8f8" font-size="25">100% coverage answers the first question only.</text><text x="75" y="590" fill="#8194af" font-size="16">Conceptual diagram · Basis: Anthropic's coverage, review latency, and escalation measures (2026)</text></g></svg>
