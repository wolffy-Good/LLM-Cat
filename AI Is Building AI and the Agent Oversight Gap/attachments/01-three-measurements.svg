<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">Three measurements of AI development</title><desc id="d">AI-led research, agent oversight, and compute allocation are distinct lenses on the development process.</desc>
<rect width="1200" height="675" fill="#0c1425"/><text x="70" y="92" fill="#f2f6fc" font-size="42" font-family="Arial,sans-serif" font-weight="700">What can outsiders measure?</text>
<g font-family="Arial,sans-serif"><rect x="70" y="158" width="320" height="330" rx="22" fill="#1b3150"/><rect x="440" y="158" width="320" height="330" rx="22" fill="#204350"/><rect x="810" y="158" width="320" height="330" rx="22" fill="#403351"/>
<text x="100" y="222" fill="#c6dfff" font-size="23">01 / WORK</text><text x="100" y="287" fill="white" font-size="32" font-weight="700">AI-led R&amp;D</text><text x="100" y="350" fill="white" font-size="22">Which tasks does AI</text><text x="100" y="385" fill="white" font-size="22">assist, lead, or own?</text>
<text x="470" y="222" fill="#b4efe7" font-size="23">02 / ACTION</text><text x="470" y="287" fill="white" font-size="32" font-weight="700">Agent oversight</text><text x="470" y="350" fill="white" font-size="22">Which actions are seen,</text><text x="470" y="385" fill="white" font-size="22">stopped, and reviewed?</text>
<text x="840" y="222" fill="#e6d1ff" font-size="23">03 / INPUT</text><text x="840" y="287" fill="white" font-size="32" font-weight="700">Compute allocation</text><text x="840" y="350" fill="white" font-size="22">Where does research</text><text x="840" y="385" fill="white" font-size="22">capacity go?</text>
<text x="70" y="555" fill="#b8c8df" font-size="24">Separate lenses. None alone proves effective control.</text><text x="70" y="615" fill="#8194af" font-size="16">Conceptual diagram · Source: Anthropic, Measurements for understanding the pace of AI development (2026)</text></g></svg>
