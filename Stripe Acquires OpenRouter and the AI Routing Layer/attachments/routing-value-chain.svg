<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
 <title id="title">AI routing value chain</title><desc id="desc">An application sends a request to a routing and observability layer, which selects among multiple model providers and reports cost, performance, and uptime.</desc>
 <rect width="1600" height="900" fill="#0e1728"/><g font-family="Arial, sans-serif"><text x="100" y="120" font-size="52" font-weight="700" fill="#fff">The routing layer: one request, many choices</text><text x="100" y="172" font-size="26" fill="#b2c2da">A model gateway can turn provider complexity into a policy decision.</text><g fill="none" stroke="#62e5d3" stroke-width="9" stroke-linecap="round"><path d="M410 450h200"/><path d="M990 450h110c110 0 80-210 190-210"/><path d="M990 450h300"/><path d="M990 450h110c110 0 80 210 190 210"/></g><rect x="120" y="320" width="290" height="260" rx="32" fill="#233c63"/><text x="265" y="430" text-anchor="middle" font-size="42" font-weight="700" fill="#fff">YOUR APP</text><text x="265" y="480" text-anchor="middle" font-size="24" fill="#bed0eb">one API request</text><rect x="610" y="250" width="380" height="400" rx="38" fill="#6044cf"/><text x="800" y="360" text-anchor="middle" font-size="46" font-weight="700" fill="#fff">ROUTING</text><text x="800" y="410" text-anchor="middle" font-size="46" font-weight="700" fill="#fff">LAYER</text><g fill="#dcd5ff" font-size="25" text-anchor="middle"><text x="800" y="490">cost · latency · uptime</text><text x="800" y="530">policy · failover · logs</text></g><g><rect x="1290" y="170" width="210" height="140" rx="25" fill="#1e8e84"/><rect x="1290" y="380" width="210" height="140" rx="25" fill="#da734d"/><rect x="1290" y="590" width="210" height="140" rx="25" fill="#3180bb"/><g fill="#fff" font-size="27" font-weight="700" text-anchor="middle"><text x="1395" y="252">PROVIDER 1</text><text x="1395" y="462">PROVIDER 2</text><text x="1395" y="672">PROVIDER 3</text></g></g></g>
</svg>
