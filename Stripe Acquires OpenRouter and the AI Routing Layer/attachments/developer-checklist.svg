<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
 <title id="title">Developer resilience checklist</title><desc id="desc">Four connected checklist cards: multi-model access, routing policy, cost observability, and failure fallback.</desc>
 <rect width="1600" height="900" fill="#fff9f3"/><g font-family="Arial, sans-serif"><text x="115" y="125" font-size="52" font-weight="700" fill="#18233b">Build for choice, not dependency</text><text x="115" y="178" font-size="27" fill="#5d6879">A practical resilience checklist for teams using foundation-model APIs</text><g stroke="#d7a54a" stroke-width="8" fill="none"><path d="M380 455h165M760 455h165M1140 455h165"/></g><g><g transform="translate(100 285)"><rect width="290" height="350" rx="28" fill="#f2d69a"/><circle cx="55" cy="58" r="28" fill="#bf7d12"/><path d="M42 59l10 10 20-25" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><text x="34" y="145" font-size="30" font-weight="700" fill="#3a2810">MULTI-MODEL</text><text x="34" y="190" font-size="30" font-weight="700" fill="#3a2810">ACCESS</text><text x="34" y="265" font-size="22" fill="#5b461e">Keep alternatives</text><text x="34" y="300" font-size="22" fill="#5b461e">available.</text></g><g transform="translate(480 285)"><rect width="290" height="350" rx="28" fill="#bfd9ed"/><circle cx="55" cy="58" r="28" fill="#3979a9"/><path d="M42 59l10 10 20-25" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><text x="34" y="145" font-size="30" font-weight="700" fill="#17324a">ROUTING</text><text x="34" y="190" font-size="30" font-weight="700" fill="#17324a">POLICY</text><text x="34" y="265" font-size="22" fill="#294e6a">Match workload to</text><text x="34" y="300" font-size="22" fill="#294e6a">model constraints.</text></g><g transform="translate(860 285)"><rect width="290" height="350" rx="28" fill="#cfcaed"/><circle cx="55" cy="58" r="28" fill="#665ca7"/><path d="M42 59l10 10 20-25" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><text x="34" y="145" font-size="30" font-weight="700" fill="#2d2a52">COST</text><text x="34" y="190" font-size="30" font-weight="700" fill="#2d2a52">VISIBILITY</text><text x="34" y="265" font-size="22" fill="#4e4977">Measure spend by</text><text x="34" y="300" font-size="22" fill="#4e4977">task and outcome.</text></g><g transform="translate(1240 285)"><rect width="260" height="350" rx="28" fill="#bfe6cf"/><circle cx="55" cy="58" r="28" fill="#32895c"/><path d="M42 59l10 10 20-25" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><text x="34" y="145" font-size="30" font-weight="700" fill="#173d29">FAILURE</text><text x="34" y="190" font-size="30" font-weight="700" fill="#173d29">FALLBACK</text><text x="34" y="265" font-size="22" fill="#315f45">Test a safe</text><text x="34" y="300" font-size="22" fill="#315f45">second path.</text></g></g></g>
</svg>
