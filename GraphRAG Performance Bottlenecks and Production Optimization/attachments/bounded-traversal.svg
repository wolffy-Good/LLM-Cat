<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bounded graph traversal</title><desc id="desc">Original explanatory diagram contrasting unbounded graph traversal with bounded traversal that limits hops, fan-out, evidence count and supports early stopping.</desc>
  <defs><style>text{font-family:Arial,'Noto Sans SC',sans-serif}.h{fill:#fff;font-size:44px;font-weight:700}.s{fill:#bcd2df;font-size:21px}.l{fill:#f2f8fb;font-size:28px;font-weight:700}.bad{fill:#ef4444}.good{fill:#34d399}.linebad{stroke:#ef4444;stroke-width:3;opacity:.65}.linegood{stroke:#34d399;stroke-width:4;opacity:.9}</style></defs>
  <rect width="1600" height="900" fill="#071722"/><text x="95" y="100" class="h">多跳优化的关键：给图遍历设边界</text><text x="95" y="142" class="s">原创示意：节点密度代表候选膨胀风险，不代表特定数据集规模</text><line x1="800" y1="210" x2="800" y2="800" stroke="#426275" stroke-width="2"/>
  <text x="110" y="235" class="l">无边界扩展</text><circle cx="300" cy="510" r="22" class="bad"/><g class="linebad"><path d="M300 510L170 350M300 510L420 320M300 510L500 510M300 510L160 650M300 510L420 690M170 350L110 270M170 350L260 260M420 320L520 245M420 320L600 360M500 510L650 480M500 510L600 610M160 650L100 740M160 650L300 760M420 690L540 770M420 690L660 700"/></g><g class="bad"><circle cx="170" cy="350" r="16"/><circle cx="420" cy="320" r="16"/><circle cx="500" cy="510" r="16"/><circle cx="160" cy="650" r="16"/><circle cx="420" cy="690" r="16"/><circle cx="110" cy="270" r="13"/><circle cx="260" cy="260" r="13"/><circle cx="520" cy="245" r="13"/><circle cx="600" cy="360" r="13"/><circle cx="650" cy="480" r="13"/><circle cx="600" cy="610" r="13"/><circle cx="100" cy="740" r="13"/><circle cx="300" cy="760" r="13"/><circle cx="540" cy="770" r="13"/><circle cx="660" cy="700" r="13"/></g><text x="110" y="845" class="s">风险：超级节点、候选暴涨、超时、噪声进入提示词</text>
  <text x="900" y="235" class="l">有边界扩展</text><circle cx="1050" cy="510" r="22" class="good"/><g class="linegood"><path d="M1050 510L930 400M1050 510L1180 410M1050 510L1190 600M930 400L870 330M1180 410L1270 350"/></g><g class="good"><circle cx="930" cy="400" r="16"/><circle cx="1180" cy="410" r="16"/><circle cx="1190" cy="600" r="16"/><circle cx="870" cy="330" r="13"/><circle cx="1270" cy="350" r="13"/></g><rect x="900" y="680" width="520" height="100" rx="15" fill="#0d3540" stroke="#34d399" stroke-width="2"/><text x="938" y="722" class="s">限制：最大跳数 · 单节点邻居数 · 返回边数</text><text x="980" y="757" class="s">足够证据后早停并取消其余任务</text><text x="900" y="845" class="s">目标：把图作为证据约束器，而不是无限扩散器</text>
</svg>
