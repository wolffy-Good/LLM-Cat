<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">How a plan split can change the cost of AI workflows</title>
  <desc id="desc">A comparison between a bundled plan and separate general AI and coding plans.</desc>
  <rect width="1200" height="540" fill="#0d1321" rx="24"/>
  <text x="70" y="72" fill="#ffffff" font-family="Arial, sans-serif" font-size="38" font-weight="700">Why a plan split can change the real cost</text>
  <text x="70" y="112" fill="#aab8d4" font-family="Arial, sans-serif" font-size="22">Illustrative structure — final Kimi pricing and quotas have not been announced.</text>
  <rect x="70" y="165" width="475" height="280" rx="20" fill="#18233a" stroke="#5f8fff" stroke-width="2"/>
  <text x="105" y="220" fill="#92b3ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">BUNDLED PLAN</text>
  <text x="105" y="270" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">One subscription</text>
  <rect x="105" y="305" width="175" height="72" rx="12" fill="#29456f"/>
  <text x="128" y="349" fill="#ffffff" font-family="Arial, sans-serif" font-size="21">General AI</text>
  <rect x="305" y="305" width="190" height="72" rx="12" fill="#29456f"/>
  <text x="332" y="349" fill="#ffffff" font-family="Arial, sans-serif" font-size="21">Kimi Code</text>
  <path d="M590 304h95" stroke="#f3c969" stroke-width="6" stroke-linecap="round"/>
  <path d="M664 284l28 20-28 20" fill="none" stroke="#f3c969" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="725" y="165" width="405" height="280" rx="20" fill="#282033" stroke="#d091f7" stroke-width="2"/>
  <text x="760" y="220" fill="#e0b8ff" font-family="Arial, sans-serif" font-size="24" font-weight="700">SEPARATE PLANS</text>
  <text x="760" y="270" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Two products</text>
  <rect x="760" y="305" width="145" height="72" rx="12" fill="#63447a"/>
  <text x="779" y="349" fill="#ffffff" font-family="Arial, sans-serif" font-size="20">General AI</text>
  <text x="924" y="350" fill="#f3c969" font-family="Arial, sans-serif" font-size="34" font-weight="700">+</text>
  <rect x="970" y="305" width="125" height="72" rx="12" fill="#63447a"/>
  <text x="983" y="349" fill="#ffffff" font-family="Arial, sans-serif" font-size="20">Code</text>
  <text x="70" y="495" fill="#aab8d4" font-family="Arial, sans-serif" font-size="20">Impact: users who need both workflows may face a higher total spend, depending on final plan design.</text>
</svg>
