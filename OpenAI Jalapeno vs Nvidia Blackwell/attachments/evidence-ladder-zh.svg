<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">证据分层</title><desc id="desc">区分实测结果、来源报告与尚未证明的商业结果。</desc><rect width="1600" height="900" fill="#08111f"/><text x="110" y="110" fill="#fff" font-family="Arial, sans-serif" font-size="52" font-weight="700">芯片数据强，不等于 API 已宣布降价</text><text x="110" y="160" fill="#9fb0c8" font-family="Arial, sans-serif" font-size="25">把实测、来源报告与商业推断放在不同证据层</text><g font-family="Arial, sans-serif"><rect x="120" y="600" width="1360" height="150" rx="24" fill="#173b36"/><text x="165" y="660" fill="#73e0b2" font-size="30" font-weight="700">已测 / 已公开</text><text x="165" y="710" fill="#fff" font-size="25">InferenceX 8k/1k 结果 · 700W 芯片 TDP · 三个公开模型家族</text><rect x="260" y="405" width="1220" height="145" rx="24" fill="#173553"/><text x="305" y="462" fill="#70d6ff" font-size="30" font-weight="700">来源报告</text><text x="305" y="512" fill="#fff" font-size="25">HBM4 / N3P B0 · 量产爬坡 · 实验室核验与基准限制</text><rect x="430" y="215" width="1050" height="140" rx="24" fill="#453247"/><text x="475" y="272" fill="#ff9cce" font-size="30" font-weight="700">尚未证明</text><text x="475" y="320" fill="#fff" font-size="25">大规模可靠性 · 所有负载领先 · 客户 API 价格下降</text></g><text x="120" y="825" fill="#8294aa" font-family="Arial, sans-serif" font-size="20">依据 OpenAI 与 SemiAnalysis 披露整理；核查日期：2026-08-26。</text></svg>
