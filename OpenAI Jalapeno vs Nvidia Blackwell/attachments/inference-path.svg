<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">LLM inference data path</title><desc id="desc">An explanatory diagram of prefill, local state, decode, and integrated networking.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#70d6ff"/></marker></defs><rect width="1600" height="900" fill="#08111f"/><text x="110" y="110" fill="#fff" font-family="Arial" font-size="52" font-weight="700">Inference speed is a data-movement problem</text><text x="110" y="160" fill="#9fb0c8" font-family="Arial" font-size="25">Jalapeño co-designs compute, memory, network, and software around the complete request</text><g font-family="Arial"><rect x="110" y="270" width="300" height="180" rx="28" fill="#173553"/><text x="160" y="340" fill="#fff" font-size="38" font-weight="700">Prefill</text><text x="160" y="390" fill="#b9c8da" font-size="24">Process prompt</text><text x="160" y="424" fill="#70d6ff" font-size="22">compute-heavy</text><path d="M420 360 H610" stroke="#70d6ff" stroke-width="8" marker-end="url(#a)"/><rect x="630" y="235" width="360" height="250" rx="28" fill="#173b36"/><text x="685" y="315" fill="#fff" font-size="38" font-weight="700">Local state</text><text x="685" y="365" fill="#b9c8da" font-size="24">Weights + KV cache</text><text x="685" y="415" fill="#73e0b2" font-size="22">keep data close</text><path d="M1000 360 H1180" stroke="#70d6ff" stroke-width="8" marker-end="url(#a)"/><rect x="1200" y="270" width="290" height="180" rx="28" fill="#453247"/><text x="1250" y="340" fill="#fff" font-size="38" font-weight="700">Decode</text><text x="1250" y="390" fill="#b9c8da" font-size="24">Generate tokens</text><text x="1250" y="424" fill="#ff9cce" font-size="22">bandwidth-heavy</text><rect x="290" y="590" width="1020" height="130" rx="65" fill="#10243b" stroke="#70d6ff" stroke-width="3"/><text x="430" y="650" fill="#fff" font-size="32" font-weight="700">Integrated fabric + predictable synchronization</text><text x="490" y="690" fill="#9fb0c8" font-size="22">less movement · less waiting · adaptable resource pool</text><path d="M800 590 V500" stroke="#70d6ff" stroke-width="5" marker-end="url(#a)"/></g><text x="110" y="825" fill="#8294aa" font-family="Arial" font-size="20">Conceptual diagram based on OpenAI's public architecture description; not a physical die layout.</text></svg>
