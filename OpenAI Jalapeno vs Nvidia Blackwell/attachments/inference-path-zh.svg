<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">LLM 推理数据路径</title><desc id="desc">Prefill、本地状态、Decode 与集成网络的解释图。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#70d6ff"/></marker></defs><rect width="1600" height="900" fill="#08111f"/><text x="110" y="110" fill="#fff" font-family="Arial, sans-serif" font-size="52" font-weight="700">推理速度，本质也是数据移动问题</text><text x="110" y="160" fill="#9fb0c8" font-family="Arial, sans-serif" font-size="25">Jalapeño 围绕完整请求协同设计计算、内存、网络与软件</text><g font-family="Arial, sans-serif"><rect x="110" y="270" width="300" height="180" rx="28" fill="#173553"/><text x="160" y="340" fill="#fff" font-size="38" font-weight="700">Prefill</text><text x="160" y="390" fill="#b9c8da" font-size="24">处理输入提示</text><text x="160" y="424" fill="#70d6ff" font-size="22">计算密集</text><path d="M420 360 H610" stroke="#70d6ff" stroke-width="8" marker-end="url(#a)"/><rect x="630" y="235" width="360" height="250" rx="28" fill="#173b36"/><text x="685" y="315" fill="#fff" font-size="38" font-weight="700">本地状态</text><text x="685" y="365" fill="#b9c8da" font-size="24">权重 + KV cache</text><text x="685" y="415" fill="#73e0b2" font-size="22">让数据靠近计算</text><path d="M1000 360 H1180" stroke="#70d6ff" stroke-width="8" marker-end="url(#a)"/><rect x="1200" y="270" width="290" height="180" rx="28" fill="#453247"/><text x="1250" y="340" fill="#fff" font-size="38" font-weight="700">Decode</text><text x="1250" y="390" fill="#b9c8da" font-size="24">逐 Token 生成</text><text x="1250" y="424" fill="#ff9cce" font-size="22">带宽受限</text><rect x="290" y="590" width="1020" height="130" rx="65" fill="#10243b" stroke="#70d6ff" stroke-width="3"/><text x="430" y="650" fill="#fff" font-size="32" font-weight="700">集成互联 + 可预测同步</text><text x="490" y="690" fill="#9fb0c8" font-size="22">少搬运 · 少等待 · 同质资源按需适配</text><path d="M800 590 V500" stroke="#70d6ff" stroke-width="5" marker-end="url(#a)"/></g><text x="110" y="825" fill="#8294aa" font-family="Arial, sans-serif" font-size="20">依据 OpenAI 公开架构说明制作的概念图，不是芯片物理版图。</text></svg>
