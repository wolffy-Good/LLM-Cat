<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Replaceable model routing</title><desc id="desc">Application traffic passes through a unified access layer to providers selected using measured policy.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#70d6ff"/></marker></defs><rect width="1600" height="900" fill="#08111f"/><text x="105" y="105" fill="#fff" font-family="Arial" font-size="52" font-weight="700">Bet on optionality, not one chip forecast</text><text x="105" y="155" fill="#9fb0c8" font-family="Arial" font-size="25">Route from task evidence: quality · latency · cost · availability · compliance</text><g font-family="Arial"><rect x="100" y="330" width="300" height="190" rx="28" fill="#173553"/><text x="180" y="410" fill="#fff" font-size="38" font-weight="700">Application</text><text x="160" y="460" fill="#b9c8da" font-size="23">stable business API</text><path d="M410 425 H595" stroke="#70d6ff" stroke-width="8" marker-end="url(#a)"/><rect x="615" y="270" width="390" height="310" rx="34" fill="#173b36" stroke="#73e0b2" stroke-width="3"/><text x="690" y="355" fill="#73e0b2" font-size="42" font-weight="700">SupaNexus</text><text x="700" y="410" fill="#fff" font-size="25">unified API boundary</text><text x="685" y="465" fill="#b9c8da" font-size="22">routing · fallback</text><text x="685" y="505" fill="#b9c8da" font-size="22">cost observation</text><path d="M1015 425 H1170" stroke="#70d6ff" stroke-width="8" marker-end="url(#a)"/><rect x="1190" y="205" width="300" height="120" rx="24" fill="#2d304f"/><text x="1250" y="275" fill="#fff" font-size="29" font-weight="700">Provider A</text><rect x="1190" y="365" width="300" height="120" rx="24" fill="#453247"/><text x="1250" y="435" fill="#fff" font-size="29" font-weight="700">Provider B</text><rect x="1190" y="525" width="300" height="120" rx="24" fill="#3f3824"/><text x="1250" y="595" fill="#fff" font-size="29" font-weight="700">Provider C</text><rect x="400" y="685" width="800" height="95" rx="47" fill="#10243b"/><text x="500" y="745" fill="#fff" font-size="27">Evaluate on successful tasks—not token list price alone</text></g></svg>
