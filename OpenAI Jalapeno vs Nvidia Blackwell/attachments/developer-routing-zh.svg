<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">可替换模型路由</title><desc id="desc">应用通过统一接入层，依据实测策略选择模型供应商。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#70d6ff"/></marker></defs><rect width="1600" height="900" fill="#08111f"/><text x="105" y="105" fill="#fff" font-family="Arial, sans-serif" font-size="52" font-weight="700">押注选择权，而不是一份芯片预测</text><text x="105" y="155" fill="#9fb0c8" font-family="Arial, sans-serif" font-size="25">依据真实任务路由：质量 · 延迟 · 成本 · 可用性 · 合规</text><g font-family="Arial, sans-serif"><rect x="100" y="330" width="300" height="190" rx="28" fill="#173553"/><text x="180" y="410" fill="#fff" font-size="38" font-weight="700">业务应用</text><text x="160" y="460" fill="#b9c8da" font-size="23">稳定的内部接口</text><path d="M410 425 H595" stroke="#70d6ff" stroke-width="8" marker-end="url(#a)"/><rect x="615" y="270" width="390" height="310" rx="34" fill="#173b36" stroke="#73e0b2" stroke-width="3"/><text x="690" y="355" fill="#73e0b2" font-size="42" font-weight="700">SupaNexus</text><text x="700" y="410" fill="#fff" font-size="25">统一 API 接入边界</text><text x="685" y="465" fill="#b9c8da" font-size="22">路由 · 故障回退</text><text x="685" y="505" fill="#b9c8da" font-size="22">成本观察</text><path d="M1015 425 H1170" stroke="#70d6ff" stroke-width="8" marker-end="url(#a)"/><rect x="1190" y="205" width="300" height="120" rx="24" fill="#2d304f"/><text x="1250" y="275" fill="#fff" font-size="29" font-weight="700">供应商 A</text><rect x="1190" y="365" width="300" height="120" rx="24" fill="#453247"/><text x="1250" y="435" fill="#fff" font-size="29" font-weight="700">供应商 B</text><rect x="1190" y="525" width="300" height="120" rx="24" fill="#3f3824"/><text x="1250" y="595" fill="#fff" font-size="29" font-weight="700">供应商 C</text><rect x="400" y="685" width="800" height="95" rx="47" fill="#10243b"/><text x="500" y="745" fill="#fff" font-size="27">按成功任务评测，而不只看 Token 标价</text></g></svg>
