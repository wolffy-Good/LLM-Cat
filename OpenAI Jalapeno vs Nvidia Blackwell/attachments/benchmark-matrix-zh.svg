<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Jalapeño 与 Blackwell 基准矩阵</title><desc id="desc">OpenAI 2026年8月25日公布的三组模型特定 InferenceX 对比。</desc><rect width="1600" height="900" fill="#08111f"/><text x="100" y="105" fill="#fff" font-family="Arial, sans-serif" font-size="52" font-weight="700">三个模型，三组同条件对比</text><text x="100" y="155" fill="#9fb0c8" font-family="Arial, sans-serif" font-size="25">InferenceX · nominal 8k/1k · 单 Token 预测 · 按芯片 TDP 归一化</text>
  <g font-family="Arial, sans-serif"><rect x="90" y="215" width="1420" height="160" rx="24" fill="#10243b"/><text x="130" y="270" fill="#73e0b2" font-size="30" font-weight="700">GPT-OSS 120B</text><text x="130" y="320" fill="#b9c8da" font-size="24">Jalapeño 700W vs GB200 1,200W</text><text x="660" y="285" fill="#fff" font-size="42" font-weight="700">1.9×</text><text x="650" y="326" fill="#9fb0c8" font-size="21">峰值 TPS / kW</text><text x="1040" y="285" fill="#fff" font-size="42" font-weight="700">低 1.7×</text><text x="1040" y="326" fill="#9fb0c8" font-size="21">端到端延迟</text><rect x="90" y="405" width="1420" height="160" rx="24" fill="#10243b"/><text x="130" y="460" fill="#ffcd70" font-size="30" font-weight="700">DeepSeek R1 670B</text><text x="130" y="510" fill="#b9c8da" font-size="24">Jalapeño 700W vs GB300 1,400W</text><text x="660" y="475" fill="#fff" font-size="42" font-weight="700">1.7×</text><text x="650" y="516" fill="#9fb0c8" font-size="21">峰值 TPS / kW</text><text x="1040" y="475" fill="#fff" font-size="42" font-weight="700">低 3.6×</text><text x="1040" y="516" fill="#9fb0c8" font-size="21">端到端延迟</text><rect x="90" y="595" width="1420" height="160" rx="24" fill="#10243b"/><text x="130" y="650" fill="#ff8d77" font-size="30" font-weight="700">Kimi K2.5 1T</text><text x="130" y="700" fill="#b9c8da" font-size="24">Jalapeño 700W vs GB300 1,400W</text><text x="660" y="665" fill="#fff" font-size="42" font-weight="700">1.5×</text><text x="650" y="706" fill="#9fb0c8" font-size="21">峰值 TPS / kW</text><text x="1040" y="665" fill="#fff" font-size="42" font-weight="700">低 3.4×</text><text x="1040" y="706" fill="#9fb0c8" font-size="21">端到端延迟</text></g><text x="100" y="825" fill="#8294aa" font-family="Arial, sans-serif" font-size="20">来源：OpenAI Jalapeño 首批结果附录（2026-08-25）。A0 工程样片，不代表所有负载。</text>
</svg>
