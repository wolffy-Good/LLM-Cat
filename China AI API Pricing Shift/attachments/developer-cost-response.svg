<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
 <title id="title">Developer response to time-of-day AI pricing</title><desc id="desc">Three-step explanatory diagram: schedule deferrable work off peak, reuse context to improve cache hits, and route work across models.</desc><rect width="1200" height="675" fill="#071522"/><text x="72" y="88" fill="#f8fafc" font-family="Arial, sans-serif" font-size="40" font-weight="700">A practical response: optimize the workload, not just the unit price</text><text x="72" y="124" fill="#9fb3c8" font-family="Arial, sans-serif" font-size="22">Three levers for teams facing time-of-day or higher API pricing</text>
 <g font-family="Arial, sans-serif"><rect x="72" y="195" width="330" height="330" rx="22" fill="#10283d" stroke="#2e5877" stroke-width="2"/><circle cx="132" cy="255" r="30" fill="#4f8cff"/><text x="121" y="264" fill="white" font-size="26" font-weight="700">1</text><text x="180" y="264" fill="#f8fafc" font-size="28" font-weight="700">Shift flexible jobs</text><text x="108" y="326" fill="#c6d5e4" font-size="21">Queue batch summaries, reports,</text><text x="108" y="358" fill="#c6d5e4" font-size="21">and evaluations for off-peak</text><text x="108" y="390" fill="#c6d5e4" font-size="21">windows when latency allows.</text><rect x="108" y="438" width="258" height="16" rx="8" fill="#314d66"/><rect x="108" y="438" width="129" height="16" rx="8" fill="#46c2a9"/><text x="108" y="490" fill="#46c2a9" font-size="20" font-weight="700">Time is a cost-control input</text>
 <rect x="435" y="195" width="330" height="330" rx="22" fill="#10283d" stroke="#2e5877" stroke-width="2"/><circle cx="495" cy="255" r="30" fill="#46c2a9"/><text x="484" y="264" fill="white" font-size="26" font-weight="700">2</text><text x="542" y="264" fill="#f8fafc" font-size="28" font-weight="700">Reuse context</text><text x="471" y="326" fill="#c6d5e4" font-size="21">Keep stable instructions and</text><text x="471" y="358" fill="#c6d5e4" font-size="21">shared context cacheable; measure</text><text x="471" y="390" fill="#c6d5e4" font-size="21">cache-hit share by workload.</text><rect x="471" y="438" width="258" height="16" rx="8" fill="#314d66"/><rect x="471" y="438" width="206" height="16" rx="8" fill="#46c2a9"/><text x="471" y="490" fill="#46c2a9" font-size="20" font-weight="700">Measure real task cost</text>
 <rect x="798" y="195" width="330" height="330" rx="22" fill="#10283d" stroke="#2e5877" stroke-width="2"/><circle cx="858" cy="255" r="30" fill="#f8b84e"/><text x="847" y="264" fill="white" font-size="26" font-weight="700">3</text><text x="905" y="264" fill="#f8fafc" font-size="28" font-weight="700">Route by task</text><text x="834" y="326" fill="#c6d5e4" font-size="21">Use a fit-for-purpose model for</text><text x="834" y="358" fill="#c6d5e4" font-size="21">routine work; reserve premium</text><text x="834" y="390" fill="#c6d5e4" font-size="21">capacity for hard tasks.</text><rect x="834" y="438" width="258" height="16" rx="8" fill="#314d66"/><rect x="834" y="438" width="178" height="16" rx="8" fill="#f8b84e"/><text x="834" y="490" fill="#f8b84e" font-size="20" font-weight="700">Avoid single-vendor lock-in</text></g><text x="72" y="610" fill="#9fb3c8" font-family="Arial, sans-serif" font-size="19">Original explanatory graphic; operational suggestions, not provider promises or financial advice.</text>
</svg>
