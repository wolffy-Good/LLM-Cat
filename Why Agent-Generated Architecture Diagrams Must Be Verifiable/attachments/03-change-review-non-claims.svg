<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Change review with explicit non-claims</title>
  <desc id="desc">A comparison between factual change detection and claims that still require human judgment.</desc>
  <rect width="1600" height="900" fill="#f2ede6"/>
  <rect x="72" y="68" width="1456" height="764" rx="32" fill="#fffaf4" stroke="#d8ccb8" stroke-width="4"/>
  <text x="110" y="142" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700">Verified change review becomes stronger when the tool separates facts from judgment.</text>

  <rect x="114" y="238" width="520" height="470" rx="28" fill="#dde8f5" stroke="#8aa2c3" stroke-width="3"/>
  <text x="154" y="300" fill="#294869" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700">What the tool can state</text>
  <text x="154" y="362" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="28">- route added</text>
  <text x="154" y="404" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="28">- node moved</text>
  <text x="154" y="446" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="28">- edge removed</text>
  <text x="154" y="488" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="28">- source pinned to a revision</text>
  <text x="154" y="530" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="28">- validation receipt exists</text>
  <text x="154" y="602" fill="#294869" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700">These are change facts.</text>

  <rect x="966" y="238" width="450" height="470" rx="28" fill="#f7dfcd" stroke="#cc9c7e" stroke-width="3"/>
  <text x="1006" y="300" fill="#8a4e2d" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700">What still needs humans</text>
  <text x="1006" y="362" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="28">- merge safety</text>
  <text x="1006" y="404" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="28">- production risk</text>
  <text x="1006" y="446" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="28">- incident impact</text>
  <text x="1006" y="488" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="28">- whether the abstraction is sufficient</text>
  <text x="1006" y="602" fill="#8a4e2d" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700">These remain judgment calls.</text>

  <rect x="660" y="314" width="240" height="148" rx="24" fill="#eef5ea" stroke="#99b08b" stroke-width="3"/>
  <text x="723" y="376" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="30">Delta view</text>
  <text x="712" y="418" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="24">Before / After</text>

  <path d="M634 418 L660 398" stroke="#607f62" stroke-width="6" marker-end="url(#arrowReview)"/>
  <path d="M900 398 L966 418" stroke="#607f62" stroke-width="6" marker-end="url(#arrowReview)"/>

  <defs>
    <marker id="arrowReview" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#607f62"/>
    </marker>
  </defs>
</svg>
