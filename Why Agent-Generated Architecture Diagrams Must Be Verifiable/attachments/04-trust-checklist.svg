<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f0e9"/>
      <stop offset="100%" stop-color="#e2edf4"/>
    </linearGradient>
    <style>
      .title { font: 700 42px Georgia, serif; fill: #1a2731; }
      .subtitle { font: 500 22px "Helvetica Neue", Arial, sans-serif; fill: #56626c; }
      .card { fill: #ffffff; stroke: #29414f; stroke-width: 3; rx: 28; }
      .num { font: 700 26px Georgia, serif; fill: #ffffff; }
      .num-bg { fill: #29414f; }
      .label { font: 700 26px "Helvetica Neue", Arial, sans-serif; fill: #20313d; }
      .copy { font: 500 20px "Helvetica Neue", Arial, sans-serif; fill: #4b5b67; }
      .foot { font: 500 18px "Helvetica Neue", Arial, sans-serif; fill: #5d6871; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg4)"/>
  <text x="110" y="105" class="title">Trust Checklist for Agent-Generated Architecture Maps</text>
  <text x="110" y="145" class="subtitle">Editorial checklist synthesized from the verified public source claims.</text>

  <rect x="110" y="230" width="640" height="180" class="card"/>
  <circle cx="175" cy="300" r="34" class="num-bg"/>
  <text x="175" y="309" text-anchor="middle" class="num">1</text>
  <text x="235" y="292" class="label">Can the structure point back to source?</text>
  <text x="235" y="335" class="copy">Look for commit-pinned files, exact lines, or another bounded evidence path.</text>

  <rect x="850" y="230" width="640" height="180" class="card"/>
  <circle cx="915" cy="300" r="34" class="num-bg"/>
  <text x="915" y="309" text-anchor="middle" class="num">2</text>
  <text x="975" y="292" class="label">Were deterministic checks part of delivery?</text>
  <text x="975" y="335" class="copy">A polished artifact matters less if validation did not gate what got shipped.</text>

  <rect x="110" y="470" width="640" height="180" class="card"/>
  <circle cx="175" cy="540" r="34" class="num-bg"/>
  <text x="175" y="549" text-anchor="middle" class="num">3</text>
  <text x="235" y="532" class="label">Can readers diff one revision against another?</text>
  <text x="235" y="575" class="copy">A trustworthy map should support stable baselines and explicit changes.</text>

  <rect x="850" y="470" width="640" height="180" class="card"/>
  <circle cx="915" cy="540" r="34" class="num-bg"/>
  <text x="915" y="549" text-anchor="middle" class="num">4</text>
  <text x="975" y="532" class="label">Are the limits stated honestly?</text>
  <text x="975" y="575" class="copy">Repository evidence is valuable, but it is not the same as live runtime proof.</text>

  <text x="110" y="790" class="foot">This checklist is an editorial synthesis. It does not claim new product capabilities beyond the linked repository documentation.</text>
</svg>
