<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">仓库证据到已检查交付物</title>
  <desc id="desc">展示仓库证据如何经过 typed source 和校验，变成更适合评审的架构图产物。</desc>
  <rect width="1600" height="900" fill="#eef2e8"/>
  <rect x="70" y="72" width="1460" height="756" rx="30" fill="#fbfdf8" stroke="#c9d3bd" stroke-width="4"/>
  <text x="110" y="144" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="42" font-weight="700">更强的架构图流程，关键在渲染之前。</text>
  <text x="110" y="186" fill="#66705f" font-family="Helvetica, Arial, sans-serif" font-size="24">公开 README 描述的不是“一次性出图”，而是一条带校验的流水线。</text>

  <rect x="120" y="286" width="210" height="96" rx="18" fill="#d9e8f7" stroke="#7ea0bf" stroke-width="3"/>
  <text x="194" y="344" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="30">仓库</text>
  <rect x="392" y="286" width="210" height="96" rx="18" fill="#e9ecd2" stroke="#9cad71" stroke-width="3"/>
  <text x="452" y="344" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="30">Agent 分析</text>
  <rect x="664" y="286" width="210" height="96" rx="18" fill="#f7ecd8" stroke="#c4a36c" stroke-width="3"/>
  <text x="706" y="344" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="30">typed IR</text>
  <rect x="936" y="286" width="210" height="96" rx="18" fill="#dfead8" stroke="#86a27a" stroke-width="3"/>
  <text x="988" y="344" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="30">校验门</text>
  <rect x="1208" y="286" width="210" height="96" rx="18" fill="#f3ddd9" stroke="#ba857d" stroke-width="3"/>
  <text x="1252" y="344" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="30">交付物</text>

  <path d="M330 334 L392 334" stroke="#5c7d98" stroke-width="6" marker-end="url(#arrowPipeZh)"/>
  <path d="M602 334 L664 334" stroke="#879651" stroke-width="6" marker-end="url(#arrowPipeZh)"/>
  <path d="M874 334 L936 334" stroke="#a88245" stroke-width="6" marker-end="url(#arrowPipeZh)"/>
  <path d="M1146 334 L1208 334" stroke="#5b7f52" stroke-width="6" marker-end="url(#arrowPipeZh)"/>

  <text x="126" y="486" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">公开材料中真正重要的证据面：</text>
  <text x="154" y="538" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="26">- 精确路径追踪</text>
  <text x="154" y="578" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="26">- 按需打开 revision-verified source</text>
  <text x="154" y="618" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="26">- Before / Delta / After 变更对比</text>
  <text x="154" y="658" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="26">- validation receipt 与修复代码</text>

  <rect x="960" y="478" width="444" height="224" rx="24" fill="#fff6eb" stroke="#d0b07d" stroke-width="3"/>
  <text x="994" y="532" fill="#7d5930" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700">边界同样重要</text>
  <text x="994" y="584" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="26">公开 README 也明确写了两类非主张：</text>
  <text x="1022" y="628" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="24">- 不隐式检查 live infrastructure</text>
  <text x="1022" y="664" fill="#1f2a30" font-family="Helvetica, Arial, sans-serif" font-size="24">- 不自动推断 impact 或 merge safety</text>

  <defs>
    <marker id="arrowPipeZh" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#516470"/>
    </marker>
  </defs>
</svg>
