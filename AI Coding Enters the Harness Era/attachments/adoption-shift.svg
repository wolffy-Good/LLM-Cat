  <g font-family="Arial,sans-serif" font-size="22">
    <text x="80" y="205" fill="#e2e8f0">Claude Code</text><rect x="285" y="173" width="234" height="36" rx="8" fill="#64748b"/><rect x="285" y="220" width="507" height="36" rx="8" fill="#8b5cf6"/><text x="535" y="202" fill="#cbd5e1">18% Jan</text><text x="808" y="249" fill="#ddd6fe">39% May–Jul</text>
    <text x="80" y="350" fill="#e2e8f0">Codex</text><rect x="285" y="318" width="39" height="36" rx="8" fill="#64748b"/><rect x="285" y="365" width="208" height="36" rx="8" fill="#10b981"/><text x="340" y="347" fill="#cbd5e1">3% Jan</text><text x="510" y="394" fill="#a7f3d0">16% May–Jul</text>
