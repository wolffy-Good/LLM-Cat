<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#08111f"/><text x="600" y="70" fill="#f8fafc" font-family="Arial,sans-serif" font-size="34" text-anchor="middle" font-weight="700">From Model Proxy to Production Control Loop</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <circle cx="600" cy="350" r="105" fill="#17392f" stroke="#34d399" stroke-width="4"/><text x="600" y="335" fill="#6ee7b7" font-size="27" font-weight="700">Policy</text><text x="600" y="370" fill="#ecfdf5" font-size="20">per team, app, agent</text>
    <rect x="80" y="150" width="260" height="120" rx="22" fill="#13243b" stroke="#38bdf8" stroke-width="2"/><text x="210" y="200" fill="#7dd3fc" font-size="23" font-weight="700">Route</text><text x="210" y="235" fill="#e2e8f0" font-size="18">quality • latency • price</text>
    <rect x="860" y="150" width="260" height="120" rx="22" fill="#2b1d3d" stroke="#c084fc" stroke-width="2"/><text x="990" y="200" fill="#d8b4fe" font-size="23" font-weight="700">Enforce</text><text x="990" y="235" fill="#f3e8ff" font-size="18">auth • budgets • safety</text>
    <rect x="860" y="455" width="260" height="120" rx="22" fill="#3a2c14" stroke="#fbbf24" stroke-width="2"/><text x="990" y="505" fill="#fde68a" font-size="23" font-weight="700">Observe</text><text x="990" y="540" fill="#fef3c7" font-size="18">tokens • errors • traces</text>
    <rect x="80" y="455" width="260" height="120" rx="22" fill="#3b2028" stroke="#fb7185" stroke-width="2"/><text x="210" y="505" fill="#fda4af" font-size="23" font-weight="700">Recover</text><text x="210" y="540" fill="#ffe4e6" font-size="18">retry • fallback • rollback</text>
    <path d="M340 210 Q600 60 860 210" fill="none" stroke="#64748b" stroke-width="4"/><path d="M990 270 V445" stroke="#64748b" stroke-width="4"/><path d="M860 515 Q600 650 340 515" fill="none" stroke="#64748b" stroke-width="4"/><path d="M210 455 V280" stroke="#64748b" stroke-width="4"/>
  </g><text x="600" y="630" fill="#94a3b8" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">Original engineering model • the value appears in the closed feedback loop</text>
</svg>
