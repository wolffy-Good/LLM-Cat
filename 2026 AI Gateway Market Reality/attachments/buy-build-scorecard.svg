<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#071321"/><text x="600" y="70" fill="#f8fafc" font-family="Arial,sans-serif" font-size="34" text-anchor="middle" font-weight="700">Evaluate the Gateway on Outcomes, Not Feature Count</text>
  <g font-family="Arial,sans-serif"><text x="120" y="145" fill="#94a3b8" font-size="18">Metric</text><text x="930" y="145" fill="#94a3b8" font-size="18">Question to test</text>
    <g fill="#e2e8f0" font-size="20"><text x="120" y="210">Reliability</text><text x="520" y="210">Does fallback preserve task success?</text><text x="120" y="285">Security</text><text x="520" y="285">Can policy stop secret and PII leakage?</text><text x="120" y="360">Economics</text><text x="520" y="360">Is cost visible by app, team, and agent?</text><text x="120" y="435">Operability</text><text x="520" y="435">Can traces explain a failed request?</text><text x="120" y="510">Portability</text><text x="520" y="510">Can one provider be replaced safely?</text></g>
    <g stroke="#334155" stroke-width="2"><path d="M100 235 H1100"/><path d="M100 310 H1100"/><path d="M100 385 H1100"/><path d="M100 460 H1100"/><path d="M100 535 H1100"/></g>
    <text x="600" y="605" fill="#6ee7b7" font-size="22" text-anchor="middle" font-weight="700">Benchmark with your own traffic, policies, and failure modes.</text>
  </g>
</svg>
